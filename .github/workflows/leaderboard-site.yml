name: Publish Leaderboard Website

on:
  push:
    branches: [main]
    paths:
      - leaderboard/site/**
      - .github/workflows/leaderboard-site.yml
  workflow_run:
    workflows: [Report Table Generation Result]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: leaderboard-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Site
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout trusted site
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source

      - name: Checkout published results
        uses: actions/checkout@v7
        with:
          ref: submission-results
          path: published-results
          persist-credentials: false

      - name: Stage site
        run: >-
          python3 source/scripts/ci/stage_leaderboard_site.py
          --site source/leaderboard/site
          --results-root published-results
          --out public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
