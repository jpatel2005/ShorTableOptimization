name: Promote Best-Known Table Generator

on:
  workflow_run:
    workflows: [Report Table Generation Result]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: table-generation-promotion
  cancel-in-progress: true

jobs:
  promote:
    name: Construct and Verify Promotion
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source
          fetch-depth: 0

      - name: Checkout published results
        uses: actions/checkout@v7
        with:
          ref: submission-results
          path: published-results
          persist-credentials: false

      - name: Install Lean
        working-directory: source
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Construct and verify best-known generator
        working-directory: source
        run: python3 -m scripts.promote --results-root ../published-results

      - name: Open or update promotion PR
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/publish_promotion.py
